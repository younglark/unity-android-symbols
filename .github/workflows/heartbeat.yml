name: heartbeat

# Public repositories disable scheduled workflows after 60 days without
# repository activity. This monthly commit keeps the schedule alive.

on:
  schedule:
    - cron: '5 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Record heartbeat
        run: date -u +%FT%TZ > last-run.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat"
          git push
